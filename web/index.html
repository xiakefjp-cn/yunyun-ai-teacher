<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>耘耘AI助教</title>
<style>body{margin:0;background:#f4f6f8;color:#233142;font:15px/1.65 system-ui}header{background:#163e39;color:white;padding:20px 5%}main{max-width:1250px;margin:24px auto;display:grid;grid-template-columns:330px 1fr;gap:22px;padding:0 20px}section,article{background:white;border:1px solid #dde4e8;border-radius:10px;padding:18px;margin-bottom:16px}h1{margin:0;font-size:24px}h2{font-size:19px}h3{margin-top:0}textarea,input,select{box-sizing:border-box;width:100%;padding:9px;border:1px solid #b8c6ce;border-radius:5px;margin:5px 0 12px}textarea{min-height:100px}button{background:#186658;color:white;border:0;border-radius:5px;padding:9px 13px;margin:5px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4f6;padding:12px;font-size:13px}.bad{color:#b42318}.good{color:#18714b}small{color:#637786}label{display:block}#notice{position:sticky;top:0;background:#fff3cc;padding:10px;z-index:2;white-space:pre-wrap}.code{font-family:Consolas,monospace;min-height:170px}details{margin:12px 0}a{color:#186658}@media(max-width:800px){main{display:block}}</style>
<header><h1>耘耘AI助教</h1><div>循环结构备课工作台 · 生成 → 真实验证 → 教师审核 → 交付</div></header><div id="notice">正在恢复会话…</div>
<main><aside><section><h2>本次备课</h2><label>学段<select id="stage"><option>初中</option><option>大学</option></select></label><label>需求与继续修改<textarea id="request">下周三给初二上一节《循环结构》，刚学完条件语句。请重点讲清终止条件与边界，安排40分钟。</textarea></label><label>班情（仅聚合人数，可粘贴JSON）<textarea id="stats">{"total":40,"missing":5,"infinite_loop":3,"boundary":6}</textarea></label><input type="file" id="upload" accept=".json"><label>模型<select id="live"><option value="false">离线演示（固定模板，非AI推理）</option><option value="true">真实模型 API（服务端配置）</option></select></label><button id="generate">生成 / 继续修改</button><small>离线模式支持重新生成；输入“故意失败”可演示死循环拦截。自由语言修改请使用API，或直接修改条目代码。</small></section><section><h2>工作区与历史</h2><div id="workspace"></div><div id="files"></div><div id="history"></div></section><section><h2>交付</h2><button id="all">逐项检查后接受全部</button><button id="download">下载教案包 ZIP</button><button id="publish">预览写入差异</button><small>只有全部验证通过且6个条目均接受后才能交付。文本准确性和课程适配仍需老师判断。</small></section></aside>
<div><section><h2>会话</h2><div id="messages"></div></section><section><h2>班情驱动的错因预警</h2><div id="warnings"></div></section><div id="items"></div><section><h2>操作记录</h2><pre id="audit"></pre></section></div></main>
<script>
const TOKEN='__TOKEN__';let state;const $=s=>document.getElementById(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'X-Yunyun-Token':TOKEN,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(!r.ok){let e=await r.json();throw Error(e.error)}return r}
async function refresh(){let d=await(await api('state')).json();state=d.state;$('workspace').textContent=d.workspace+' · '+d.mode;$('files').innerHTML=d.files.map(f=>`<details><summary>${esc(f.path)}</summary><pre>${esc(f.content)}</pre></details>`).join('');render()}
async function act(fn){document.querySelectorAll('button').forEach(b=>b.disabled=true);$('notice').textContent='执行中：代码正在独立进程运行，请稍候…';try{await fn();await refresh()}catch(e){$('notice').textContent=e.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function render(){let r=state.current;$('notice').textContent=r?`${r.source==='mock'?'离线模板演示':'真实模型API'} · 修订 ${r.id.slice(0,8)} · ${r.verified?'配套用例全部通过，等待教师审核':'验证失败，禁止交付'} · 已接受 ${state.accepted.length}/6`:'尚无产出，请提出备课需求';$('messages').innerHTML=state.messages.map(m=>`<p><b>${m.role==='user'?'教师':'助教'}：</b>${esc(m.content)}</p>`).join('');$('history').innerHTML='<h3>修订恢复</h3>'+state.revisions.map(r=>`<button onclick="rollback('${r.id}')">${r.id.slice(0,8)} ${r.verified?'通过':'失败'}</button>`).join('');$('audit').textContent=JSON.stringify(state.events.slice(-12),null,2);if(!r)return;
$('warnings').innerHTML=r.bundle.warnings.map(w=>`<article><b>${esc(w.category)}</b> · ${esc(w.evidence)}<br>触发：${esc(w.trigger)}<br>干预：${esc(w.intervention)}</article>`).join('');
$('items').innerHTML=r.bundle.items.map(x=>{let rep=r.reports.find(t=>t.id===x.id);return `<article><h2>${esc(x.title)} ${state.accepted.includes(x.id)?'✓ 已接受':''}</h2>${x.kind==='lesson'?`<pre>${esc(JSON.stringify(x,null,2))}</pre>`:`<p>${esc(x.prompt||x.explanation)}</p><p>${esc((x.rubric||[]).join('；'))}</p><textarea class="code" id="code_${x.id}">${esc(x.code)}</textarea><button onclick="edit('${x.id}')">保存修改并重新验证</button>${rep.cases.map(c=>`<pre class="${c.passed?'good':'bad'}">${c.passed?'通过':'失败'} · 输入 ${esc(JSON.stringify(c.stdin))}\n期望 ${esc(JSON.stringify(c.expected))} / 实际 ${esc(JSON.stringify(c.stdout))}${c.error?'\n错误 '+esc(c.error):''}</pre>`).join('')}`}<button onclick="review('${x.id}',true)">接受</button><button onclick="review('${x.id}',false)">拒绝 / 撤回接受</button></article>`}).join('')}
function review(id,accept){act(()=>api('review',{id,accept}))}function edit(id){act(()=>api('edit',{id,code:$('code_'+id).value}))}function rollback(id){act(()=>api('rollback',{id}))}
$('generate').onclick=()=>act(()=>api('generate',{request:$('request').value,stage:$('stage').value,stats:JSON.parse($('stats').value),live:$('live').value==='true'}));
$('upload').onchange=async e=>{if(e.target.files[0])$('stats').value=await e.target.files[0].text()};
$('all').onclick=()=>act(async()=>{if(!state.current)throw Error('请先生成');if(!confirm('确认已逐项检查教案、参考解、用例期望、难度与预警？'))return;for(let x of state.current.bundle.items)await api('review',{id:x.id,accept:true})});
$('download').onclick=()=>act(async()=>{let r=await api('download',{}),url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='循环结构备课包.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$('publish').onclick=()=>act(async()=>{let p=await(await api('publish',{})).json();let box=document.createElement('dialog');box.style='width:80%;max-height:80vh';box.innerHTML='<h2>写入 '+esc(p.directory)+'</h2><pre>'+esc(p.changes.map(c=>(c.overwrite?'覆写 ':'新增 ')+c.file+'\n'+c.diff).join('\n'))+'</pre><button id="commit">确认写入（已有文件自动备份）</button><button id="cancel">取消</button>';document.body.append(box);box.showModal();box.querySelector('#cancel').onclick=()=>box.remove();box.querySelector('#commit').onclick=()=>{box.remove();act(async()=>{let r=await(await api('publish',{confirm:true})).json();alert('已真实写入 '+r.directory)})}});
refresh().catch(e=>$('notice').textContent=e.message);
</script></html>
